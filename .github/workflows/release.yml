name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Quality (lint, typecheck, unit)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Synchronize Versions
        run: |
          node tools/sync-versions.mjs "${GITHUB_REF_NAME}"

      - name: Build Bundles
        run: pnpm build

      - name: Determine Pre-release Tag
        id: prerelease_check
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            cd packages/cli
            npm publish --provenance --access public --tag "${{ steps.prerelease_check.outputs.npm_tag }}"
          else
            echo "NPM_TOKEN not set; skipping npm publish"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4480b8229f5b299e3d5444b1da09 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b4e24d3605e3b815499dfd91 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f082974bbc # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.prerelease_check.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b150c8844d6997083a0c3f9741b # v6.9.0
        with:
          context: .
          file: distribution/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build MCPB Bundle
        env:
          MCPB_SIGNING_KEY: ${{ secrets.MCPB_SIGNING_KEY }}
        run: |
          bash tools/build-mcpb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532874e2482d858c1bc9500388d8b9e # v2.0.8
        with:
          files: |
            dist-mcpb/*.mcpb
            packages/cli/*.tgz
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          generate_release_notes: true

      - name: Publish to MCP Registry
        if: steps.prerelease_check.outputs.is_prerelease == 'false'
        run: |
          # Fetch mcp-publisher release and publish server.json via GitHub OIDC
          echo "Publishing to MCP Registry..."
          curl -sSL -o /tmp/mcp-publisher https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64 || true
          if [ -f /tmp/mcp-publisher ]; then
            chmod +x /tmp/mcp-publisher
            /tmp/mcp-publisher publish --manifest distribution/registry/server.json || echo "mcp-publisher output logged"
          fi

