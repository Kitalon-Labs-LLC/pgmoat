name: Docker Smoke

# Builds the image and runs an MCP session against Postgres in Docker.
# Runs when the image or its inputs change, including Dependabot base-image bumps.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'distribution/docker/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tools/smoke-docker.sh'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run smoke test
        run: bash tools/smoke-docker.sh
