services:
  warehouse:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: analytics_ro
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: warehouse_db
    ports:
      - "54322:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_ro -d warehouse_db"]
      interval: 2s
      timeout: 2s
      retries: 10

