services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_ro
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: corp_db
    ports:
      - "54321:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ro -d corp_db"]
      interval: 2s
      timeout: 2s
      retries: 10

