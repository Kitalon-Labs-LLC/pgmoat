services:
  tenantdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tenant_ro
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: multi_tenant_db
    ports:
      - "54325:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_ro -d multi_tenant_db"]
      interval: 2s
      timeout: 2s
      retries: 10

